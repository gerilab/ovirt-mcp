name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint and formatting with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type checking with Mypy
        run: |
          mypy src tests

      - name: Run unit tests
        run: |
          pytest -v tests/unit

  docker:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ovirt-mcp:test

      - name: Verify containerized tools registration
        run: |
          docker run --rm --entrypoint python ovirt-mcp:test -c "import ovirt_mcp.server; print('Container health check OK: Loaded', len(ovirt_mcp.server.mcp._tool_manager._tools), 'tools')"
