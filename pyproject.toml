[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ovirt-mcp"
version = "0.8.3"
description = "Model Context Protocol (MCP) server for oVirt and Oracle Linux Virtualization Manager (OLVM)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Geri Lab", email = "info@gerilab.hu" }
]
keywords = [
    "ovirt",
    "olvm",
    "mcp",
    "model-context-protocol",
    "virtualization",
    "enterprise",
    "llm",
    "ai-agent"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Hardware",
]

dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "ovirt-engine-sdk-python>=4.6.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
ovirt-mcp = "ovirt_mcp.server:main"

[project.urls]
Homepage = "https://github.com/gerilab/ovirt-mcp"
Repository = "https://github.com/gerilab/ovirt-mcp"
Issues = "https://github.com/gerilab/ovirt-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ovirt_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff specific
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "ovirtsdk4.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
